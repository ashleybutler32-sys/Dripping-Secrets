<svg width="200" height="320" viewBox="0 0 200 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Full-body Dimi — Dimi's Office header -->

  <!-- Head -->
  <circle cx="100" cy="68" r="48" fill="#D8A7A7"/>
  <!-- Hair -->
  <path d="M55 62 Q100 8 145 62 Q130 22 100 22 Q70 22 55 62Z" fill="#1A1A1A"/>
  <!-- Left ear -->
  <ellipse cx="53" cy="72" rx="7" ry="9" fill="#C89494"/>
  <!-- Right ear -->
  <ellipse cx="147" cy="72" rx="7" ry="9" fill="#C89494"/>
  <!-- Left hoop earring -->
  <circle cx="53" cy="80" r="6" stroke="#B76E79" stroke-width="2.5" fill="none"/>
  <!-- Right hoop earring -->
  <circle cx="147" cy="80" r="6" stroke="#B76E79" stroke-width="2.5" fill="none"/>
  <!-- Left eye -->
  <ellipse cx="85" cy="70" rx="7" ry="7.5" fill="#111"/>
  <circle cx="87.5" cy="67.5" r="2" fill="white"/>
  <!-- Right eye -->
  <ellipse cx="115" cy="70" rx="7" ry="7.5" fill="#111"/>
  <circle cx="117.5" cy="67.5" r="2" fill="white"/>
  <!-- Brows -->
  <path d="M73 56 Q85 49 97 56" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M103 56 Q115 49 127 56" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Smile -->
  <path d="M83 88 Q100 104 117 88" stroke="#1A1A1A" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <!-- Nose -->
  <path d="M96 78 Q100 84 104 78" stroke="#C89494" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Neck -->
  <rect x="88" y="112" width="24" height="20" fill="#D8A7A7"/>

  <!-- Blazer body -->
  <path d="M38 290 Q100 180 162 290 L162 320 L38 320 Z" fill="#4B1F5F"/>
  <!-- Blazer lapels -->
  <path d="M100 132 L80 160 L100 150 Z" fill="#3a1849"/>
  <path d="M100 132 L120 160 L100 150 Z" fill="#3a1849"/>
  <!-- Shirt -->
  <rect x="84" y="130" width="32" height="160" fill="#111111"/>
  <!-- Rose gold lapel pin (D) -->
  <circle cx="128" cy="185" r="8" fill="#B76E79"/>
  <text x="128" y="189" text-anchor="middle" fill="white" font-size="9" font-weight="bold" font-family="serif">D</text>

  <!-- Left arm (smartwatch side) -->
  <path d="M72 148 Q44 175 36 210" stroke="#D8A7A7" stroke-width="22" stroke-linecap="round" fill="none"/>
  <!-- Smartwatch -->
  <rect x="24" y="200" width="22" height="14" rx="4" fill="#B76E79"/>
  <rect x="26" y="202" width="18" height="10" rx="2" fill="#1a0a26"/>
  <text x="35" y="210" text-anchor="middle" fill="#B76E79" font-size="6" font-family="monospace">DS</text>
  <!-- Left hand -->
  <ellipse cx="34" cy="218" rx="12" ry="10" fill="#D8A7A7"/>

  <!-- Right arm + tablet -->
  <path d="M128 148 Q156 172 165 200" stroke="#D8A7A7" stroke-width="22" stroke-linecap="round" fill="none"/>
  <!-- Tablet -->
  <rect x="148" y="188" width="42" height="56" rx="7" fill="#222"/>
  <rect x="152" y="192" width="34" height="44" rx="4" fill="#2d1040"/>
  <!-- Tablet screen glow -->
  <rect x="154" y="194" width="30" height="14" rx="2" fill="#4B1F5F" opacity="0.8"/>
  <rect x="154" y="211" width="20" height="4" rx="1" fill="#B76E79" opacity="0.6"/>
  <rect x="154" y="218" width="26" height="4" rx="1" fill="#B76E79" opacity="0.4"/>
  <rect x="154" y="225" width="16" height="4" rx="1" fill="#B76E79" opacity="0.3"/>
  <!-- Right hand holding tablet -->
  <ellipse cx="162" cy="245" rx="12" ry="10" fill="#D8A7A7"/>

  <!-- Legs -->
  <rect x="78" y="285" width="22" height="35" rx="6" fill="#2a0f3d"/>
  <rect x="100" y="285" width="22" height="35" rx="6" fill="#2a0f3d"/>
  <!-- Shoes -->
  <ellipse cx="89" cy="318" rx="16" ry="8" fill="#111"/>
  <ellipse cx="111" cy="318" rx="16" ry="8" fill="#111"/>
  <!-- Shoe highlight -->
  <ellipse cx="85" cy="315" rx="7" ry="3" fill="#333" opacity="0.6"/>
  <ellipse cx="107" cy="315" rx="7" ry="3" fill="#333" opacity="0.6"/>

  <!-- Breathing animation on whole figure -->
  <animateTransform attributeName="transform" type="translate" values="0,0;0,-3;0,0" dur="3.5s" repeatCount="indefinite" additive="sum"/>
</svg>
